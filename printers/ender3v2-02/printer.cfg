# Ender 3 V2 — Creality 4.2.2 mainboard, BLTouch/CR-Touch probe
#
# Derived from klipper/config/printer-creality-ender3-v2-2020.cfg
# Verify against the config shipped with YOUR Klipper checkout before first use:
#   ~/klipper/config/printer-creality-ender3-v2-2020.cfg
#
# Firmware build options for the 4.2.2 (see docs/04-firmware.md):
#   STM32 / STM32F103 / 28KiB bootloader / 8MHz crystal / Serial on USART1 PA10/PA9

[mcu]
# Bound by the LXC into a fixed path, so this line is identical on every printer.
serial: /dev/printer
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: PB9
dir_pin: PC2
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PB7
dir_pin: PB8
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_max: 235
homing_speed: 50

#####################################################################
#  Z axis — PICK ONE. These two blocks are mutually exclusive.
#####################################################################

# --- (A) WITH BLTouch / CR-Touch  [ACTIVE] ---------------------------
[stepper_z]
step_pin: PB5
dir_pin: !PB6
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop   # the probe IS the Z endstop
position_max: 250
position_min: -5                       # lets PROBE_CALIBRATE go below zero

# --- (B) STOCK mechanical Z endstop, no probe  [inactive] ------------
#[stepper_z]
#step_pin: PB5
#dir_pin: !PB6
#enable_pin: !PC3
#microsteps: 16
#rotation_distance: 8
#endstop_pin: ^PA7
#position_endstop: 0.0
#position_max: 250

#####################################################################

[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PC3
microsteps: 16
rotation_distance: 34.406      # VERIFY per printer — docs/05, step 4
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 100.0
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: pid                   # REPLACE with PID_CALIBRATE output
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid                   # REPLACE with PID_CALIBRATE output
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[fan]
pin: PA0

# The stock DWIN LCD is NOT supported by Klipper. There is deliberately no
# [display] section. A dark screen after flashing is expected, not a fault.

#####################################################################
#  Probe
#####################################################################

[bltouch]
# PB0/PB1 are the 5-pin bed-level header on Creality 4.2.x boards.
sensor_pin: ^PB1
control_pin: PB0
# MEASURE these per printer — they depend on the mount, not the printer model.
# -44 / -9 is the common Creality-mount value and is a starting guess only.
x_offset: -44
y_offset: -9
z_offset: 0.0                  # set by PROBE_CALIBRATE, do not guess
speed: 5
samples: 2
samples_result: median
probe_with_touch_mode: True    # more reliable on clone CR-Touch units
stow_on_each_sample: False

[safe_z_home]
# Nozzle position for G28 Z. With the offsets above the probe lands at
# (73.5, 108.5) — on the bed. If you change the offsets, re-check this.
home_xy_position: 117.5, 117.5
speed: 50
z_hop: 10
z_hop_speed: 5

[bed_mesh]
speed: 120
horizontal_move_z: 5
# These are PROBE coordinates. Bounded by the probe offsets: with x_offset -44
# the probe cannot go past x=191 without driving the nozzle off the bed.
mesh_min: 15, 15
mesh_max: 190, 200
probe_count: 5, 5
algorithm: bicubic
fade_start: 1.0
fade_end: 10.0
fade_target: 0

[screws_tilt_adjust]
# For SCREWS_TILT_CALCULATE — tells you how far to turn each bed knob.
# Coordinates are NOZZLE positions of the four bed screws.
screw1: 30, 30
screw1_name: front left
screw2: 200, 30
screw2_name: front right
screw3: 200, 200
screw3_name: back right
screw4: 30, 200
screw4_name: back left
horizontal_move_z: 10
speed: 100
screw_thread: CW-M4

#####################################################################
#  Optional hardware — uncomment if fitted
#####################################################################

#[filament_switch_sensor runout]
#switch_pin: ^PA4
#pause_on_runout: True

#[input_shaper]
#shaper_freq_x: 0              # set from ringing tower / accelerometer
#shaper_freq_y: 0
#shaper_type: mzv

#####################################################################
#  Macros — the slicer calls these; keep print logic here, not in OrcaSlicer
#####################################################################

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    M140 S{BED_TEMP}                    ; start bed heating
    G90                                 ; absolute positioning
    M190 S{BED_TEMP}                    ; wait for bed BEFORE homing/meshing
    G28                                 ; home (Z via probe)
    BED_MESH_PROFILE LOAD=default       ; saved mesh; see note below
    M109 S{EXTRUDER_TEMP}               ; wait for nozzle
    G92 E0                              ; reset extruder
    G1 X0.1 Y20 Z0.3 F5000.0            ; move to prime line start
    G1 X0.1 Y200.0 Z0.3 F1500.0 E15     ; draw prime line
    G1 X0.4 Y200.0 Z0.3 F5000.0
    G1 X0.4 Y20 Z0.3 F1500.0 E30        ; draw return line
    G92 E0
    G1 Z2.0 F3000

# Note: START_PRINT loads a SAVED mesh rather than probing every print. On a farm
# that is ~90 seconds per job you get back. Run BED_MESH_CALIBRATE + SAVE_CONFIG
# manually after any bed/spring/sheet change. If you'd rather probe every time,
# swap the LOAD line for: BED_MESH_CALIBRATE
# The bed is heated before homing on purpose — the sheet moves as it expands.

[gcode_macro END_PRINT]
gcode:
    G91                                 ; relative
    G1 E-2 F2700                        ; retract
    G1 E-2 Z0.2 F2400                   ; retract and lift
    G1 X5 Y5 F3000                      ; wipe
    G90                                 ; absolute
    G1 Z{printer.toolhead.position.z + 10} F3000
    G1 X0 Y{printer.toolhead.axis_maximum.y - 10} F3000  ; present print
    M106 S0                             ; fan off
    M104 S0                             ; nozzle off
    M140 S0                             ; bed off
    M84 X Y E                           ; disable steppers except Z

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    CLEAR_PAUSE
    TURN_OFF_HEATERS
    M106 S0
    BASE_CANCEL_PRINT

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
variable_extrude: 1.0
gcode:
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 E-{E} F2100
    G1 Z10
    G90
    G1 X0 Y0 F6000

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    G91
    G1 E{E} F2100
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
    BASE_RESUME

# Required by Moonraker / Fluidd
[virtual_sdcard]
path: /home/klipper/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]
[display_status]
[exclude_object]

