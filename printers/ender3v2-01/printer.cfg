#####################################################################
#  Macros — the slicer calls these; keep print logic here, not in OrcaSlicer
#####################################################################

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    M140 S{BED_TEMP}                    ; start bed heating
    G90                                 ; absolute positioning
    G28                                 ; home
    M190 S{BED_TEMP}                    ; wait for bed
    M109 S{EXTRUDER_TEMP}               ; wait for nozzle
    G92 E0                              ; reset extruder
    G1 X0.1 Y20 Z0.3 F5000.0            ; move to prime line start
    G1 X0.1 Y200.0 Z0.3 F1500.0 E15     ; draw prime line
    G1 X0.4 Y200.0 Z0.3 F5000.0
    G1 X0.4 Y20 Z0.3 F1500.0 E30        ; draw return line
    G92 E0
    G1 Z2.0 F3000

[gcode_macro END_PRINT]
gcode:
    G91                                 ; relative
    G1 E-2 F2700                        ; retract
    G1 E-2 Z0.2 F2400                   ; retract and lift
    G1 X5 Y5 F3000                      ; wipe
    G90                                 ; absolute
    G1 Z{printer.toolhead.position.z + 10} F3000
    G1 X0 Y{printer.toolhead.axis_maximum.y - 10} F3000  ; present print
    M106 S0                             ; fan off
    M104 S0                             ; nozzle off
    M140 S0                             ; bed off
    M84 X Y E                           ; disable steppers except Z

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    CLEAR_PAUSE
    TURN_OFF_HEATERS
    M106 S0
    BASE_CANCEL_PRINT

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
variable_extrude: 1.0
gcode:
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 E-{E} F2100
    G1 Z10
    G90
    G1 X0 Y0 F6000

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    G91
    G1 E{E} F2100
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
    BASE_RESUME

# Required by Moonraker / Fluidd
[virtual_sdcard]
path: /home/klipper/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]
[display_status]
[exclude_object]

