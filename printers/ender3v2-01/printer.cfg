# Ender 3 V2 — Creality 4.2.2 / 4.2.7 mainboard
#
# Derived from klipper/config/printer-creality-ender3-v2-2020.cfg
# Verify against the config shipped with YOUR Klipper checkout before first use:
#   ~/klipper/config/printer-creality-ender3-v2-2020.cfg
#
# Build options for this board (see docs/04-firmware.md):
#   STM32 / STM32F103 / 28KiB bootloader / 8MHz crystal / Serial on USART1 PA10/PA9

[mcu]
# Bound by the LXC into a fixed path so this line is identical on every printer.
serial: /dev/printer
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: PB9
dir_pin: PC2
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PB7
dir_pin: PB8
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PB5
dir_pin: !PB6
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: ^PA7
position_endstop: 0.0
position_max: 250

[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PC3
microsteps: 16
rotation_distance: 34.406      # VERIFY per printer — see docs/05, step 4
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 100.0
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: pid                   # REPLACE with PID_CALIBRATE output
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid                   # REPLACE with PID_CALIBRATE output
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[fan]
pin: PA0

# The stock DWIN LCD is NOT supported by Klipper. There is deliberately no [display]
# section here. The screen going dark after flashing is expected.

