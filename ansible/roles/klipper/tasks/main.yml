---
- name: Install Klipper build and runtime dependencies
  ansible.builtin.apt:
    name:
      - git
      - python3
      - python3-dev
      - python3-venv
      - libffi-dev
      - build-essential
      - libncurses-dev
      - libusb-dev
      - pkg-config
      - sudo
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Create the {{ klipper_user }} user"
  ansible.builtin.user:
    name: "{{ klipper_user }}"
    home: "{{ klipper_home }}"
    shell: /bin/bash
    groups: [sudo, dialout, tty]
    append: true
    state: present

- name: Passwordless sudo for the klipper user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/99-{{ klipper_user }}"
    content: "{{ klipper_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: "visudo -cf %s"

- name: Create printer_data directories
  ansible.builtin.file:
    path: "{{ klipper_data }}/{{ item }}"
    state: directory
    owner: "{{ klipper_user }}"
    group: "{{ klipper_user }}"
    mode: "0755"
  loop: [config, logs, gcodes, comms, systemd]

- name: Clone Klipper
  ansible.builtin.git:
    repo: "{{ klipper_repo }}"
    dest: "{{ klipper_home }}/klipper"
    version: "{{ klipper_version }}"
    depth: 1
  become: true
  become_user: "{{ klipper_user }}"
  notify: Restart klipper

- name: Create the klippy virtualenv
  ansible.builtin.pip:
    requirements: "{{ klipper_home }}/klipper/scripts/klippy-requirements.txt"
    virtualenv: "{{ klipper_home }}/klippy-env"
    virtualenv_command: "python3 -m venv"
  become: true
  become_user: "{{ klipper_user }}"
  notify: Restart klipper

- name: Install the klipper systemd unit
  ansible.builtin.template:
    src: klipper.service.j2
    dest: /etc/systemd/system/klipper.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart klipper

- name: Enable klipper
  ansible.builtin.systemd:
    name: klipper
    enabled: true
    daemon_reload: true
